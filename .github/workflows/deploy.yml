name: Deploy Admin Server to Cloud Run

on:
  push:
    branches:
      - production

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canopy-admin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: canopy-admin
          persist-credentials: false

      - name: Checkout canopy (for assets and tests)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScottieR/canopy
          path: canopy
          ssh-key: ${{ secrets.CANOPY_DEPLOY_KEY }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |-
            canopy/package-lock.json
            canopy-admin/package-lock.json

      - name: Verify Canopy
        working-directory: canopy
        run: |
          npm ci --ignore-scripts
          npm run test -- --run
          npm run build
          npm audit --audit-level=high
        continue-on-error: false

      - name: Verify Admin
        working-directory: canopy-admin
        env:
          NODE_ENV: test
          ADMIN_API_KEY: ci-integration-admin-key
        run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3
          npm test
          npm run build
          npm audit --audit-level=high

      - name: Send Alert on Test Failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error --max-time 15 \
              -X POST -H 'Content-type: application/json' \
              --data '{"text":"Canopy Admin deploy failed: security or regression checks did not pass."}' \
              "$ALERT_WEBHOOK_URL"
          fi

      - name: Prepare Dockerfile
        run: |
          cat << 'EOF' > .dockerignore
          **/.env
          **/.env.*
          !**/.env.example
          **/.git
          **/node_modules
          EOF
          cat << 'EOF' > Dockerfile
          FROM node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293 AS build
          WORKDIR /app
          RUN apk add --no-cache python3 make g++
          COPY canopy-admin/package*.json ./canopy-admin/
          WORKDIR /app/canopy-admin
          RUN npm ci --ignore-scripts
          RUN npm rebuild better-sqlite3
          WORKDIR /app
          COPY canopy/public ./canopy/public
          COPY canopy-admin ./canopy-admin
          WORKDIR /app/canopy-admin
          RUN npm run build
          RUN npm prune --omit=dev --ignore-scripts

          FROM node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
          ENV NODE_ENV=production
          WORKDIR /app
          COPY --from=build /app/canopy ./canopy
          COPY --from=build /app/canopy-admin ./canopy-admin
          WORKDIR /app/canopy-admin
          ENV PORT=8080
          EXPOSE 8080
          CMD ["node", "server.js"]
          EOF

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/418538192879/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github@canopy-admin-server.iam.gserviceaccount.com

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: canopy-admin
          region: us-central1
          source: ./ # This uploads the entire workspace (both repos and the Dockerfile) to Google Cloud Build
          project_id: canopy-admin-server
          secrets: |-
            GEMINI_API_KEY=canopy-admin-gemini-api-key:latest
            MESHY_API_KEY=canopy-admin-meshy-api-key:latest
            ANTHROPIC_API_KEY=canopy-admin-anthropic-api-key:latest
            ADMIN_API_KEY=canopy-admin-admin-api-key:latest
